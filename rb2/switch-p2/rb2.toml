# Dragon Ball: Raging Blast 2 for Nintendo Switch - settings. Put next to rb2.nro (sdmc:/switch/rb2-nx/rb2.toml).
# Every key is optional. Restart the game after a change.

# Renderer: "p2" = native Vulkan renderer (fast), "xenos" = Xbox 360 GPU emulation (slow, for comparison).
rb2_renderer = "p2"
p2_renderer = "native"
render_target_path_vulkan = "fsi"

# Internal resolution (the game keeps its 1280x720 coordinates). 640, 720, 800, 880, 960, 1040, 1120 or 1280 wide.
# Lower = faster GPU; the picture is upscaled with FSR 1.
shd_render_width = 640
shd_render_height = 360
present_effect = "fsr"

# Nintendo's official 460.8 MHz handheld GPU profile (not an overclock). false = stock 307.2 MHz handheld.
rb2_gpu_460 = true

# CPU clock in MHz. Fights are CPU-bound: 1785 (top of Nintendo's own clock table, used while loading) is what
# gets them to 60 fps. 1020 = stock game clock (fights ~35-50 fps, slow motion), 0 = leave it to the system/sys-clk.
rb2_cpu_mhz = 1785

# Native renderer settings measured best on the Silent Hill / Prototype Switch ports.
p2_native_msaa = false
p2_native_record_thread = true
p2_native_async_pipelines = false
p2_native_pipeline_prewarm = true
p2_min_frame_vblanks = 1
p2_pace_before_present = false
p2_native_depth24 = true
gpu_specialize_texture_signs = true
p2_native_copy_specialization = true
p2_native_depth_words_direct = true
p2_native_structured_jumps = true
p2_native_edram_depth_alias_clear = true
p2_native_resolve_xenia_pack = true
p2_native_binding_revalidate = true
p2_native_dynamic_buffer_upload = true
p2_native_sampled_stable_ranges = true
p2_native_sampled_min_bytes = 16384
p2_native_max_anisotropy = 2
p2_native_texture_lod_bias = 0.0
p2_native_async_present = true
p2_native_exact_texture_check = true
p2_native_max_mip_levels = 1
p2_native_occlusion_queries = false
shd_scale_pitches = 15
shd_ui_native = false

# Local versus: one sideways Joy-Con per player works (pair them in HOME > Controllers > Change Grip/Order first).
# If a sideways Joy-Con stick moves the wrong way, set this to false.
input_joycon_rotate_stick = true

# Online versus (both players need this same build and the same game files).
# Through a server (rb2/server/rb2_relay.py), no port forwarding for players:
#   rb2_netplay = "server", rb2_netplay_server = "<server address>:7777",
#   rb2_netplay_room = "<code you share with a friend>"  (empty = quick match with anyone waiting)
# Direct, without a server: player 1 rb2_netplay = "host" (forward UDP 7777 to this console),
#   player 2 rb2_netplay = "join" with rb2_netplay_peer = "<player 1's IP>".
# Leave rb2_netplay empty for normal play. Raise rb2_netplay_delay (frames, 1-7) if it stutters.
rb2_netplay = ""
rb2_netplay_server = ""
rb2_netplay_room = ""
rb2_netplay_peer = ""
rb2_netplay_port = 7777
rb2_netplay_delay = 3

# Threads: the game gets three cores.
p2_msr_lock_mode = 2
p2_guest_priorities = false
p2_guest_affinity = false
p2_host_core_mask = 6
p2_main_thread_priority = 58
p2_main_thread_mask = 14
p2_guest_core_mask = 15
p2_audio_core_mask = 8

log_level = "warn"
log_flush_level = "warn"

# Diagnostics (a few log lines every 10 s; set log_level = "info" and this to true when reporting slowdowns).
p2_gpu_wait_diagnostics = false
proto_stage_timer = false
